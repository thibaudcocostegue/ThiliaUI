<style>
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--thilia-bg);color:var(--thilia-fg)}
.cover svg{position:absolute;inset:0;display:block}
.accent{fill:var(--thilia-accent)}
.ink{fill:var(--thilia-fg)}
.steel{fill:var(--thilia-outline)}
.plus{fill:none;stroke:var(--thilia-outline);stroke-width:2}
.mark{position:absolute;left:32px;bottom:32px;width:440px}
.name{margin:0;font:500 88px/.95 var(--font-sans);letter-spacing:-.02em}
.tagline{margin:12px 0 0;font:400 14px/20px var(--font-sans);color:var(--thilia-muted)}
</style>

      composition : dalle accent débordant du coin haut droit, deux blocs modulaires dessous
      motif : grille de croix, car le système se dit précis et technique, avec thilia-grid-pitch en écho
      échelles : pas thilia-space-32, angles thilia-radius (0)
