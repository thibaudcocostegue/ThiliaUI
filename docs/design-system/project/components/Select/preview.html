<div class="thilia-demo thilia-demo--column" style="gap: 6px; max-width: 360px">
  <span class="thilia-field-label" id="s1">Région</span>
  <button class="thilia-select-trigger" aria-expanded="true" aria-labelledby="s1">
    Europe Ouest
    <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8l4-4 4 4"></path></svg>
  </button>
  <div class="thilia-select-list" role="listbox" aria-labelledby="s1">
    <button class="thilia-select-option" role="option" aria-selected="true">
      Europe Ouest
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--thilia-accent)" stroke-width="2"><path d="M2 7l3.5 3.5L12 4"></path></svg>
    </button>
    <button class="thilia-select-option" role="option" aria-selected="false">Europe Centrale</button>
    <button class="thilia-select-option" role="option" aria-selected="false">Amérique du Nord</button>
  </div>
</div>
