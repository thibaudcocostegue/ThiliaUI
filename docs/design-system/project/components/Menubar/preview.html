<!-- @dsCard group="Extensions · Menus" height=230 subtitle="Barre de menus desktop" -->
<div class="thilia-demo thilia-demo--column" style="gap: 4px">
  <div class="thilia-menubar" role="menubar" aria-label="Menu principal">
    <button class="thilia-menubar-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="true">Fichier</button>
    <button class="thilia-menubar-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="false">Édition</button>
    <button class="thilia-menubar-trigger" role="menuitem" aria-haspopup="menu" aria-expanded="false">Affichage</button>
  </div>
  <div class="thilia-menu" role="menu" aria-label="Fichier">
    <button class="thilia-menu-item" role="menuitem" data-highlighted>Nouveau<span class="thilia-menu-shortcut">⌘N</span></button>
    <button class="thilia-menu-item" role="menuitem">Ouvrir<span class="thilia-menu-shortcut">⌘O</span></button>
    <button class="thilia-menu-item" role="menuitem">Enregistrer<span class="thilia-menu-shortcut">⌘S</span></button>
  </div>
</div>
